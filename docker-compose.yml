services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRADING_MODE: ${TRADING_MODE:-OFF}
      LIVE_ARMED: ${LIVE_ARMED:-false}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      INSTRUMENT_SYNC_ENABLED: ${INSTRUMENT_SYNC_ENABLED:-false}
      KITE_WEBSOCKET_ENABLED: ${KITE_WEBSOCKET_ENABLED:-false}
      MARKET_DATA_WATCHLIST: ${MARKET_DATA_WATCHLIST:-NSE:NIFTYBEES,NSE:SBIN}
      MARKET_DATA_WATCHLIST_FILE: ${MARKET_DATA_WATCHLIST_FILE:-}
      MARKET_DATA_MAX_INSTRUMENTS: ${MARKET_DATA_MAX_INSTRUMENTS:-10}
      SCANNER_ENABLED: ${SCANNER_ENABLED:-false}
      SCANNER_AUTO_LOOP_ENABLED: ${SCANNER_AUTO_LOOP_ENABLED:-false}
      SCANNER_AUTO_LOOP_USE_SELECTED_UNIVERSE: ${SCANNER_AUTO_LOOP_USE_SELECTED_UNIVERSE:-false}
      UNIVERSE_SELECTION_ENABLED: ${UNIVERSE_SELECTION_ENABLED:-false}
      PAPER_ENABLED: ${PAPER_ENABLED:-false}
      PAPER_MODE: ${PAPER_MODE:-OFF}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trader:change-me@postgres:5432/trader}
      REDIS_URL: ${REDIS_URL:-redis://:change-me@redis:6379/0}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
