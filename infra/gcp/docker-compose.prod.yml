services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_MANAGER_ENABLED: ${SECRET_MANAGER_ENABLED:-false}
      TRADING_MODE: "OFF"
      LIVE_ARMED: "false"
      KITE_AUTH_ENABLED: ${KITE_AUTH_ENABLED:-false}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-}
      KITE_SESSION_ENCRYPTION_KEY: ${KITE_SESSION_ENCRYPTION_KEY:-}
      OPERATOR_AUTH_TOKEN: ${OPERATOR_AUTH_TOKEN:-}
      MARKET_DATA_ENABLED: "${MARKET_DATA_ENABLED:-false}"
      INSTRUMENT_SYNC_ENABLED: "${INSTRUMENT_SYNC_ENABLED:-false}"
      KITE_WEBSOCKET_ENABLED: "${KITE_WEBSOCKET_ENABLED:-false}"
      MARKET_DATA_WATCHLIST: "${MARKET_DATA_WATCHLIST:-NSE:NIFTYBEES,NSE:SBIN}"
      MARKET_DATA_WATCHLIST_FILE: "${MARKET_DATA_WATCHLIST_FILE:-}"
      MARKET_DATA_MODE: "${MARKET_DATA_MODE:-quote}"
      MARKET_DATA_MAX_INSTRUMENTS: "${MARKET_DATA_MAX_INSTRUMENTS:-10}"
      MARKET_DATA_STALE_AFTER_SECONDS: "${MARKET_DATA_STALE_AFTER_SECONDS:-10}"
      MARKET_DATA_CANDLE_INTERVAL: "${MARKET_DATA_CANDLE_INTERVAL:-1minute}"
      SCANNER_ENABLED: "${SCANNER_ENABLED:-false}"
      SCANNER_STRATEGIES: "${SCANNER_STRATEGIES:-opening_range_breakout_long,vwap_pullback_continuation_long}"
      SCANNER_OBSERVATION_MODE: "${SCANNER_OBSERVATION_MODE:-SHADOW}"
      SCANNER_FUTURE_LIVE_ELIGIBLE_STRATEGY: "${SCANNER_FUTURE_LIVE_ELIGIBLE_STRATEGY:-opening_range_breakout_long}"
      SCANNER_OPENING_RANGE_MINUTES: "${SCANNER_OPENING_RANGE_MINUTES:-15}"
      SCANNER_STALE_AFTER_SECONDS: "${SCANNER_STALE_AFTER_SECONDS:-10}"
      SCANNER_MIN_VOLUME_RATIO: "${SCANNER_MIN_VOLUME_RATIO:-1.5}"
      SCANNER_MAX_SPREAD_PCT: "${SCANNER_MAX_SPREAD_PCT:-0.20}"
      SCANNER_REQUIRE_SPREAD_FOR_FUTURE_LIVE: "${SCANNER_REQUIRE_SPREAD_FOR_FUTURE_LIVE:-true}"
      SCANNER_BENCHMARK_SYMBOL: "${SCANNER_BENCHMARK_SYMBOL:-}"
      SCANNER_AUTO_LOOP_ENABLED: "${SCANNER_AUTO_LOOP_ENABLED:-false}"
      SCANNER_AUTO_LOOP_INTERVAL_SECONDS: "${SCANNER_AUTO_LOOP_INTERVAL_SECONDS:-300}"
      SCANNER_AUTO_LOOP_SYMBOLS: "${SCANNER_AUTO_LOOP_SYMBOLS:-}"
      SCANNER_AUTO_LOOP_USE_MARKET_WATCHLIST: "${SCANNER_AUTO_LOOP_USE_MARKET_WATCHLIST:-true}"
      SCANNER_AUTO_LOOP_STORE_REJECTIONS: "${SCANNER_AUTO_LOOP_STORE_REJECTIONS:-false}"
      SCANNER_AUTO_LOOP_MAX_SYMBOLS: "${SCANNER_AUTO_LOOP_MAX_SYMBOLS:-20}"
      SCANNER_AUTO_LOOP_TIMEFRAME: "${SCANNER_AUTO_LOOP_TIMEFRAME:-1minute}"
      SCANNER_AUTO_LOOP_START_AFTER_IST: "${SCANNER_AUTO_LOOP_START_AFTER_IST:-10:07}"
      SCANNER_AUTO_LOOP_STOP_AFTER_IST: "${SCANNER_AUTO_LOOP_STOP_AFTER_IST:-15:00}"
      SCANNER_AUTO_LOOP_RUN_ON_MARKET_DAYS_ONLY: "${SCANNER_AUTO_LOOP_RUN_ON_MARKET_DAYS_ONLY:-false}"
      SCANNER_AUTO_LOOP_MIN_CANDLES: "${SCANNER_AUTO_LOOP_MIN_CANDLES:-51}"
      SCANNER_AUTO_LOOP_REQUIRE_SESSION_START: "${SCANNER_AUTO_LOOP_REQUIRE_SESSION_START:-true}"
      SCANNER_AUTO_LOOP_REQUIRE_CONTINUITY: "${SCANNER_AUTO_LOOP_REQUIRE_CONTINUITY:-true}"
      SCANNER_AUTO_LOOP_SUPPRESS_DUPLICATE_REJECTIONS: "${SCANNER_AUTO_LOOP_SUPPRESS_DUPLICATE_REJECTIONS:-true}"
      SCANNER_AUTO_LOOP_CANDIDATES_ALWAYS_PERSIST: "${SCANNER_AUTO_LOOP_CANDIDATES_ALWAYS_PERSIST:-true}"
      SCANNER_AUTO_LOOP_USE_SELECTED_UNIVERSE: "${SCANNER_AUTO_LOOP_USE_SELECTED_UNIVERSE:-false}"
      UNIVERSE_SELECTION_ENABLED: "${UNIVERSE_SELECTION_ENABLED:-false}"
      UNIVERSE_SELECTION_POOL: "${UNIVERSE_SELECTION_POOL:-}"
      UNIVERSE_SELECTION_POOL_FILE: "${UNIVERSE_SELECTION_POOL_FILE:-}"
      UNIVERSE_SELECTION_MAX_POOL_SYMBOLS: "${UNIVERSE_SELECTION_MAX_POOL_SYMBOLS:-100}"
      UNIVERSE_SELECTION_OUTPUT_LIMIT: "${UNIVERSE_SELECTION_OUTPUT_LIMIT:-20}"
      UNIVERSE_SELECTION_TIMEFRAME: "${UNIVERSE_SELECTION_TIMEFRAME:-1minute}"
      UNIVERSE_SELECTION_MIN_SESSION_CANDLES: "${UNIVERSE_SELECTION_MIN_SESSION_CANDLES:-51}"
      UNIVERSE_SELECTION_LOOKBACK_DAYS: "${UNIVERSE_SELECTION_LOOKBACK_DAYS:-5}"
      UNIVERSE_SELECTION_REQUIRE_ACTIVE_INSTRUMENT: "${UNIVERSE_SELECTION_REQUIRE_ACTIVE_INSTRUMENT:-true}"
      UNIVERSE_SELECTION_REQUIRE_CONTINUITY: "${UNIVERSE_SELECTION_REQUIRE_CONTINUITY:-true}"
      UNIVERSE_SELECTION_BENCHMARK_SYMBOL: "${UNIVERSE_SELECTION_BENCHMARK_SYMBOL:-NSE:NIFTYBEES}"
      UNIVERSE_SELECTION_MIN_PRICE: "${UNIVERSE_SELECTION_MIN_PRICE:-20}"
      UNIVERSE_SELECTION_MAX_PRICE: "${UNIVERSE_SELECTION_MAX_PRICE:-10000}"
      UNIVERSE_SELECTION_MIN_AVG_TURNOVER: "${UNIVERSE_SELECTION_MIN_AVG_TURNOVER:-0}"
      UNIVERSE_SELECTION_MIN_ATR_PCT: "${UNIVERSE_SELECTION_MIN_ATR_PCT:-0}"
      UNIVERSE_SELECTION_MAX_ATR_PCT: "${UNIVERSE_SELECTION_MAX_ATR_PCT:-10}"
      UNIVERSE_SELECTION_EXCLUDE_SPECIAL_CHAR_SYMBOLS: "${UNIVERSE_SELECTION_EXCLUDE_SPECIAL_CHAR_SYMBOLS:-true}"
      UNIVERSE_SELECTION_STORE_RUNS: "${UNIVERSE_SELECTION_STORE_RUNS:-true}"
      UNIVERSE_SELECTION_USE_LATEST_FOR_SCANNER_BATCH: "${UNIVERSE_SELECTION_USE_LATEST_FOR_SCANNER_BATCH:-false}"
      UNIVERSE_SELECTION_STALE_POLICY: "${UNIVERSE_SELECTION_STALE_POLICY:-exclude}"
      PAPER_ENABLED: "${PAPER_ENABLED:-false}"
      PAPER_MODE: "${PAPER_MODE:-OFF}"
      PAPER_MAX_TRADES_PER_DAY: "${PAPER_MAX_TRADES_PER_DAY:-3}"
      PAPER_DEFAULT_QUANTITY: "${PAPER_DEFAULT_QUANTITY:-1}"
      PAPER_ENTRY_BUFFER_PCT: "${PAPER_ENTRY_BUFFER_PCT:-0}"
      PAPER_STOP_PCT: "${PAPER_STOP_PCT:-0.50}"
      PAPER_TARGET_R_MULTIPLE: "${PAPER_TARGET_R_MULTIPLE:-2.0}"
      PAPER_FORCE_FLAT_TIME_IST: "${PAPER_FORCE_FLAT_TIME_IST:-15:10}"
      PAPER_ESTIMATED_COST_PER_TRADE: "${PAPER_ESTIMATED_COST_PER_TRADE:-0}"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
